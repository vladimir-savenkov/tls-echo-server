name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # Релиз создаётся один раз до параллельных сборок: иначе задачи Linux и
  # Windows конкурентно вызвали бы `gh release create` и одна из них упала.
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      # Тег — источник имён артефактов, поэтому project(VERSION) и
      # vcpkg.json version-string обязаны ему соответствовать: проверяем
      # до публикации, пока рассинхрон не ушёл в релиз.
      - name: Verify version matches the tag
        run: |
          version="${RELEASE_TAG#v}"
          cmake_version=$(sed -n -E 's/^project\(tls_echo_server VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          vcpkg_version=$(sed -n -E 's/^  "version-string": "([0-9.]+)",/\1/p' vcpkg.json)
          echo "Tag: ${version}, CMakeLists.txt: ${cmake_version}, vcpkg.json: ${vcpkg_version}"
          if [[ "${cmake_version}" != "${version}" || "${vcpkg_version}" != "${version}" ]]; then
            echo "::error::Version mismatch: tag ${RELEASE_TAG}, CMakeLists.txt ${cmake_version}, vcpkg.json ${vcpkg_version}. Use scripts/bump-version.sh to bump."
            exit 1
          fi

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --verify-tag --generate-notes
          fi

  build-linux:
    name: Linux / Release
    runs-on: ubuntu-24.04
    needs: create-release

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake ninja-build libboost-all-dev libssl-dev libspdlog-dev

      - name: Configure release build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build and test
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Install and package
        run: |
          package="tls-echo-server-${RELEASE_TAG}-linux-x86_64"
          cmake --install build --prefix "dist/${package}"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          sha256sum "dist/${package}.tar.gz" > "dist/${package}.tar.gz.sha256"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="tls-echo-server-${RELEASE_TAG}-linux-x86_64"
          gh release upload "${RELEASE_TAG}" \
            "dist/${package}.tar.gz" \
            "dist/${package}.tar.gz.sha256" \
            --clobber

  build-windows:
    name: Windows / MSVC Release
    runs-on: windows-2025
    needs: create-release

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      # Статический triplet: exe в архиве самодостаточны, без DLL
      # OpenSSL/Boost/spdlog рядом (в отличие от Debug-сборки в ci.yml).
      - name: Configure release build
        shell: pwsh
        run: >-
          cmake -S . -B build/windows -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build and test
        run: |
          cmake --build build/windows --config Release --parallel 2
          ctest --test-dir build/windows -C Release --output-on-failure

      - name: Install and package
        shell: pwsh
        run: |
          $package = "tls-echo-server-$env:RELEASE_TAG-windows-x86_64"
          cmake --install build/windows --config Release --prefix "dist/$package"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"
          # Формат файла совпадает с выводом sha256sum: "<hash>  <имя>".
          $hash = (Get-FileHash "dist/$package.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $package.zip" | Out-File -FilePath "dist/$package.zip.sha256" -Encoding ascii

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = "tls-echo-server-$env:RELEASE_TAG-windows-x86_64"
          gh release upload "$env:RELEASE_TAG" `
            "dist/$package.zip" `
            "dist/$package.zip.sha256" `
            --clobber
